name: guest

on:
  push:
    branches: [main]
  pull_request:
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  commits:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Commit subjects are sentence-case prose, and the checker's controls
        run: |
          curl -fsSL https://raw.githubusercontent.com/V-Sekai-fire/manuals-weftspun/main/scripts/check_commit_style.py -o "$RUNNER_TEMP/check_commit_style.py"
          python3 "$RUNNER_TEMP/check_commit_style.py" --self-test
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            python3 "$RUNNER_TEMP/check_commit_style.py" --base "origin/${{ github.base_ref }}"
          fi

  build:
    needs: commits
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          path: weft/3-interactor/solidcraft-guest
      - name: Tools from apt
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q g++-16-riscv64-linux-gnu rustc gcc-16-riscv64-linux-gnu cargo git clang lld
      - name: The goal manifest's engine sibling + riscv64 sysroot
        working-directory: weft
        run: |
          # Pin the engine to the manifest revision so CI checks the same rev
          # the goal manifest gates (bare main drifts onto upstream moves and
          # breaks mid-refactor). Fast shallow fetch of the exact SHA.
          ENGINE_REV=5c2fa3e9ca94d09c47a48256209c2939d0fcd39b
          git init -q 3-interactor/solidcraft
          git -C 3-interactor/solidcraft remote add origin https://github.com/bherbruck/solidcraft.git
          git -C 3-interactor/solidcraft fetch --depth 1 origin $ENGINE_REV
          git -C 3-interactor/solidcraft checkout -q FETCH_HEAD
          git clone -q --depth 1 https://github.com/V-Sekai-fire/repository-riscv64-sysroot.git 5-repository/riscv64-sysroot
      - name: Build the guest ELF from a clean runner
        working-directory: weft/3-interactor/solidcraft-guest
        env:
          RUSTC_SYSROOT: ""
          # cc-rs picks up the C compiler from CC_<target> / TARGET_CC_<target>,
          # hyphens or underscores. The bare name riscv64-linux-gnu-gcc is a
          # non-executable stub on ubuntu-26.04; point every variant at the
          # real apt toolchain.
          CC_riscv64gc-unknown-linux-gnu: riscv64-linux-gnu-gcc-16
          CC_riscv64gc_unknown_linux_gnu: riscv64-linux-gnu-gcc-16
          TARGET_CC_riscv64gc-unknown-linux-gnu: riscv64-linux-gnu-gcc-16
          TARGET_CC_riscv64gc_unknown_linux_gnu: riscv64-linux-gnu-gcc-16
        run: |
          export PATH="/root/.cargo/bin:${PATH}"
          rustup default stable
          rustup target add riscv64gc-unknown-linux-gnu
          echo "LD=$(command -v ld.lld)" >> "$GITHUB_ENV"
          cargo build --release --target-dir "$RUNNER_TEMP/build"
          cp "$RUNNER_TEMP/build/riscv64gc-unknown-linux-gnu/release/solidcraft-guest" ./guest.elf
      - uses: actions/upload-artifact@v4
        with:
          name: solidcraft-guest-elf-${{ github.sha }}
          path: guest.elf

  bintr:
    needs: [build, commits]
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          path: weft/3-interactor/solidcraft-guest
      - name: Tools from apt
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q clang lld qemu-user
      - name: The goal manifest's riscv64 sysroot
        working-directory: weft
        run: git clone -q --depth 1 https://github.com/V-Sekai-fire/repository-riscv64-sysroot.git 5-repository/riscv64-sysroot
      - uses: actions/download-artifact@v4
        with:
          name: solidcraft-guest-elf-${{ github.sha }}
          path: ${{ runner.temp }}/elf
      - name: native translation and interpretation with the engine sibling
        working-directory: weft/3-interactor/solidcraft-guest
        run: |
          echo "host=linux"
          # Placeholder control: run the ELF's self-test once a native qemu
          # invocation is wired up. Kept minimal so the WIP builds; the
          # bintr control (native vs interpreted round-trip) is added in a
          # follow-up commit once the guest's self-test entry exists.
          echo "bintr: ELF staged for control (follow-up)"
